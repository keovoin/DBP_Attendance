# Fly.io configuration for the Telegram Attendance Tracker.
#
# The bot is a LONG-POLLING WORKER: it only makes OUTBOUND calls to Telegram and
# receives no inbound web traffic. Fly's proxy auto-stop/auto-suspend feature
# only manages Machines that sit behind an [http_service]; to that feature a
# background poller always looks "idle", so it SUSPENDS the machine even though
# the bot is busy. We therefore deliberately do NOT define an [http_service]
# here - with no service in front of it, the Machine simply runs 24/7.
#
# Ref: https://fly.io/docs/blueprints/long-running-tasks/

app = 'dbp-attendance'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

# Non-secret configuration. Secrets (BOT_TOKEN, ADMIN_TELEGRAM_IDS) are set
# by the GitHub Actions deploy workflow / `fly secrets set` and never committed.
[env]
  DB_PATH = '/data/attendance.db'
  TZ_OFFSET_HOURS = '7'          # Cambodia / Indochina Time (ICT, UTC+7)
  GEOFENCE_RADIUS_METERS = '20'
  POLL_TIMEOUT_SECONDS = '30'

# Persistent volume for the SQLite database, mounted at /data so attendance
# history survives deploys and restarts. Create it once with:
#   fly volumes create attendance_data --region sin --size 1
[[mounts]]
  source = 'attendance_data'
  destination = '/data'

# A single always-on Machine. A Telegram bot must be a single poller: two
# machines calling getUpdates would fight over messages.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
