# fly.toml app configuration file generated for dbp-attendance on 2026-07-08T04:28:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dbp-attendance'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/attendance.db'
  GEOFENCE_RADIUS_METERS = '20'
  POLL_TIMEOUT_SECONDS = '30'
  TZ_OFFSET_HOURS = '7'

[[mounts]]
  source = 'attendance_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
