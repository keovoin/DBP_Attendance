# Fly.io configuration for the Telegram Attendance Tracker.
#
# This app runs BOTH the Telegram bot (long-polling worker) AND the admin web
# dashboard in a single process on one Machine, sharing one SQLite database.
#
# CRITICAL: because the bot is a poller that gets little/no inbound web traffic,
# Fly's proxy would consider the Machine "idle" and SUSPEND it, pausing the bot.
# We prevent that with auto_stop_machines = 'off' and min_machines_running = 1,
# so the Machine runs 24/7. The [http_service] exists so the admin dashboard is
# reachable in a browser.
#
# Ref: https://fly.io/docs/blueprints/long-running-tasks/

app = 'dbp-attendance'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

# Non-secret configuration. Secrets (BOT_TOKEN, ADMIN_TELEGRAM_IDS,
# ADMIN_PORTAL_PASSWORD) are set with `fly secrets set` / the deploy workflow
# and are never committed.
[env]
  DB_PATH = '/data/attendance.db'
  TZ_OFFSET_HOURS = '7'           # Cambodia / Indochina Time (ICT, UTC+7)
  GEOFENCE_RADIUS_METERS = '100'
  POLL_TIMEOUT_SECONDS = '30'
  PORT = '8080'

# Persistent volume for the SQLite database, mounted at /data so attendance
# history survives deploys and restarts. Create it once with:
#   fly volumes create attendance_data --region sin --size 1
[[mounts]]
  source = 'attendance_data'
  destination = '/data'

# The admin web dashboard. Kept always-on (never auto-stopped/suspended) so the
# bot keeps polling. A single Machine only: a Telegram bot must be one poller.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'get'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
